version: '3.8'

services:
  # 1. PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: ip_sakti_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ip_sakti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ip_sakti_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/ip_sakti
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
      - CONFIDENCE_THRESHOLD=0.60
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000", "http://localhost:80", "*"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  # 3. React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ip_sakti_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
